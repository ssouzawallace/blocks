name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    # Run CI on every PR regardless of target branch.
    # This ensures feature branches (e.g. copilot/*) are tested before merge.
    branches:
      - '**'

jobs:
  # ── Blender script validation (Python, no Blender required) ───────────────
  validate-blender-scripts:
    name: Validate Blender Python Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax-check all generate_*.py scripts
        run: |
          echo "=== Checking Blender script syntax ==="
          find Assets/Models -name "generate_*.py" | sort | while read f; do
            python3 -m py_compile "$f" && echo "  OK  $f" || { echo "FAIL $f"; exit 1; }
          done

      - name: Run Board model hierarchy tests
        run: |
          pip install pytest --quiet
          python3 -m pytest Assets/Tests/Python/ -v --tb=short
        continue-on-error: false

  # ── Unity EditMode tests ──────────────────────────────────────────────────
  unity-tests:
    name: Unity EditMode Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # Unity 6000.2.10f1 matches the project version (ProjectSettings/ProjectVersion.txt)
          unityVersion: 6000.2.10f1
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
